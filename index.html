
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ベジタブル性格診断</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section id="start">
      <h1>🥕 ベジタブル性格診断 🥦</h1>
      <p>あなたはどの野菜タイプ？</p>
      <p>8つの質問で性格を診断！</p>
      <button onclick="startQuiz()">
        診断スタート！
      </button>
    </section>

    <section id="quiz" hidden>
      <p id="progress"></p>
      <h2 id="question"></h2>
      <div id="choices"></div>
      <button onclick="goBack()">前の質問へ</button>
    </section>

    <section id="result" hidden>
      <h2>診断結果</h2>
      <img id="character" alt="" hidden>
      <h1 id="vegetable"></h1>
      <h3 id="type"></h3>
      <p id="description"></p>
      <p id="strength"></p>
      <p id="weakness"></p>
      <p id="phrase"></p>
      <button onclick="startQuiz()">
        もう一度診断する
      </button>
    </section>
  </main>
</body>
</html>
